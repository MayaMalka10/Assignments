<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qPCR Analysis Results</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 30px; }
        h1 { color: #333; text-align: center; }
        table { width: 80%; margin: 0 auto; border-collapse: collapse; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .highlight { font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>
    <h1>qPCR Fold Change Results</h1>
    <table>
        <thead>
            <tr>
                <th>Sample Name</th>
                <th>Ct Target (RRBP1)</th>
                <th>Ct Ref (GAPDH)</th>
                <th>dCt</th>
                <th>ddCt</th>
                <th>Fold Change (2^-ddCt)</th>
            </tr>
        </thead>
        <tbody>
            <!-- כאן ה-HTML רץ על כל שורה מהפייתון ומדפיס אותה לטבלה -->
            {% for row in results %}
            <tr>
                <td>{{ row['Sample Name'] }}</td>
                <td>{{ row['Ct_Target (RRBP1)'] }}</td>
                <td>{{ row['Ct_Ref (GAPDH)'] }}</td>
                <td>{{ row['dCt'] }}</td>
                <td>{{ row['ddCt'] }}</td>
                <td class="highlight">{{ row['Fold_Change'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
